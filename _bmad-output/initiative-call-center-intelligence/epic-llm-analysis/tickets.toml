# Epic 4 breakdown, in build order. Table order is build order; ids are permanent names.

[[entry]]
id = 1
type = "story"
title = "Tracer: provider factory and real summarization"
description = "Adds the provider factory with OpenAI (langchain-openai; a 60 s request timeout and no client-side retries set for every client; a missing key for the selected provider makes the stage set status failed with a reason naming the provider and the key variable, never a value) and replaces the summarization stub with one structured-output call over the redacted transcript that returns a schema-valid Summary or rejects the output; it adds the one injection seam for a fake chat model, an autouse fake in tests/conftest.py so no test reaches a real LLM, and a `live` pytest marker deselected by default, and moves the direct-call security test onto the fake."
verify = "With the fake model the pipeline completes with a validated summary and no network access, invalid fake output fails the run without passing it on, and a missing key fails with the expected reason; with OPENAI_API_KEY set, a `live` test summarizes a fixed redacted transcript on OpenAI."
covers = ["CAP-5", "CAP-8"]
after = ["1.1", "3.1", "3.3"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Gemini and Groq providers"
description = "Adds Gemini (langchain-google-genai, key passed explicitly from GEMINI_API_KEY or GOOGLE_API_KEY) and Groq (langchain-groq) to the factory, so LLM_PROVIDER alone selects the provider and its model setting, and a missing key fails the run the way entry 1 defined."
verify = "For each provider, factory tests build the right client class and model from settings alone, and the pipeline completes on a per-provider fake chat model with only LLM_PROVIDER changed; no live call, since only an OpenAI key is available."
covers = ["CAP-8"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Retry and failure policy"
description = "Adds one retry helper that both LLM stages call through, bounding calls: one structured call per stage, one retry for schema-invalid output with the validation error, up to two backoff retries for rate-limit or network errors, a 60 s timeout per request; after that the stage sets status failed with a reason naming the stage and provider and never quoting the transcript."
verify = "Fake-model tests count calls (at most 6 per analyzed call once QA scoring is real, at most 3 per stage now), show invalid output is retried then rejected and never passed on, and show a failed run skips to report with the expected reason and audit."
covers = ["CAP-5", "CAP-8"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "QA scoring stage"
description = "Replaces the QA scoring stub with one structured-output call, made through entry 3's retry helper, that scores the five dimensions 1-10 with rationales against a rubric, including the Compliance checklist kept as one module-level list in the rubric (agent name and company, recording notice, identity verified before account details, no promises the company cannot keep); any LLM overall is ignored and QAScores computes the weighted overall."
verify = "Fake-model tests show valid scores give the Python overall even when the model supplies a different one, out-of-range or missing dimensions are rejected, and the rubric names every Compliance check; a `live` test scores the fixed redacted transcript on OpenAI."
covers = ["CAP-6"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Refactor sweep"
description = "Cleanup only across the epic, scoped when it starts from the plans and deferred review findings."
verify = "pytest and ruff pass with no behavior change."
covers = []
after = [1, 2, 3, 4]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "End-to-end analysis suite"
description = "Runs the fixture calls through the full pipeline with only LLM_PROVIDER changed across openai, gemini and groq (fake chat models offline; OpenAI live when its key is set), with the LLM guard proving both stages see only redacted text and a blocked call never reaches them."
verify = "The offline suite passes for all three providers, and the marked live suite passes on OpenAI with OPENAI_API_KEY set; both reuse entry 1's fake-model seam and `live` marker."
covers = ["CAP-5", "CAP-6", "CAP-8"]
after = [5]
hitl = true
risk = "medium"
